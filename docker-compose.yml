services:
  ipan:
    build:
      context: .
      args:
        VERSION: ${IPAN_VERSION:-dev}
    image: ipan:latest
    container_name: ipan
    restart: unless-stopped
    ports:
      - "${IPAN_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      IPAN_DATA_DIR: /app/data
      # 反向代理（Nginx / Traefik）后面部署时打开，用于识别真实域名与协议
      IPAN_TRUST_PROXY: ${IPAN_TRUST_PROXY:-false}
    volumes:
      - ipan-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/setup/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ipan-data:
