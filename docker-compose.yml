services:
  ipan:
    image: ghcr.io/flik6/ipan:latest
    container_name: ipan
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      IPAN_DATA_DIR: /app/data
    volumes:
      - ipan-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/setup/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ipan-data:
